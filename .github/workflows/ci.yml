name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: alpine:edge
    steps:
      - run: apk add --no-cache git nodejs ruby shellcheck
      - uses: actions/checkout@v4
      - run: shellcheck -s sh rpgm install.sh build-mkxp-z.sh test/run.sh
      - run: for f in lib/rgss/*.rb; do ruby -c "$f" >/dev/null || exit 1; done
      - run: ./test/run.sh
      - run: ./install.sh --user && ~/.local/bin/rpgm --version && ./install.sh --user --uninstall && test ! -e ~/.local/lib/rpgm
